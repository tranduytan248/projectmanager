name: ttkdgp_mobile
description: Ung dung di dong cho he thong quan ly du an & nhan su TTKDGP.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management + DI
  provider: ^6.1.5+1

  # Goi API
  dio: ^5.4.3+1

  # Luu access/refresh token an toan
  flutter_secure_storage: ^9.2.2

  # Cache trang thai dang nhap (AppCache) tren nen SharedPreferences
  shared_preferences: ^2.5.3

  # Cache offline nhe cho danh sach cong viec/du an
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dinh dang ngay/gio, so
  intl: ^0.19.0

  # Cache anh (avatar, file dinh kem)
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
