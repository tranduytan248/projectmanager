name: ttkdgp_mobile
description: BrewTask - Quan Ly Cong Viec. Ung dung di dong cho he thong quan ly du an & nhan su TTKDGP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Dich cac chuoi co san cua Flutter (date picker, "OK"/"Huy"...) sang tieng Viet.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management + DI
  provider: ^6.1.5+1

  # Goi API
  dio: ^5.4.3+1

  # Luu access/refresh token an toan
  flutter_secure_storage: ^9.2.2

  # Cache trang thai dang nhap (AppCache) tren nen SharedPreferences
  shared_preferences: ^2.5.3

  # Cache offline nhe cho danh sach cong viec/du an
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dinh dang ngay/gio, so
  intl: ^0.20.3

  # Cache anh (avatar, file dinh kem)
  cached_network_image: ^3.3.1

  # Vuot de lo thao tac nhanh tren dong danh sach cong viec (kieu Jira mobile)
  flutter_slidable: ^3.1.1

  # Doc so phien ban dang chay (hien o chan man Dang nhap) — luon khop ban build that,
  # khong can go tay va tu tay dong bo voi pubspec.yaml moi lan tang version.
  package_info_plus: ^8.1.2

  # Firebase Analytics (Android/iOS) — doc cau hinh tu android/app/google-services.json va
  # ios/Runner/GoogleService-Info.plist, khoi tao o main.dart. Ban web dung rieng gtag.js
  # nhung thang trong web/index.html, khong qua goi nay.
  firebase_core: ^4.13.0
  firebase_analytics: ^12.4.6
  # phosphor_flutter (goc) khong tuong thich Flutter moi: IconData da thanh "final class" nen
  # PhosphorIconData khong the extends duoc nua, build that (khong phai flutter analyze) se loi
  # bien dich. phosphor_icons la ban ke thua duoc bao tuong thich Flutter 3.43+, cung API.
  phosphor_icons: ^3.0.1

  # Chon anh/tai lieu dinh kem khi gui Trao doi (man Chi tiet cong viec)
  file_picker: ^8.1.4
  # Thu muc tam de luu file dinh kem tai ve truoc khi mo bang ung dung ngoai
  path_provider: ^2.1.5
  # Mo file da tai ve bang ung dung ngoai dung theo loai file (pdf/doc/zip...)
  open_filex: ^4.5.0
  google_fonts: ^8.2.1

dependency_overrides:
  # file_picker (AAR bien dich san o API 34) keo theo flutter_plugin_android_lifecycle ban moi
  # nhat doi consumer phai compileSdk >= 36 — ghim ve ban cu hon, van tuong thich API 34, cho
  # toi khi file_picker tu phat hanh ban moi khop dung.
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon_app.png"
  remove_alpha_ios: true
  # Chua khai bao adaptive icon (Android 8+) thi he thong tu boc icon bang nen trang mac dinh,
  # lo mot vet trang quanh icon du anh goc da dung thiet ke. icon_app.png da san co vong tron
  # brandBlue + coc trang, goc trong suot (xem ghi chu AppTheme.brandBlue) — dung lai chinh no
  # lam ca hai lop la du, khong can dung anh rieng.
  adaptive_icon_background: "#1A56A8"
  adaptive_icon_foreground: "icon_app.png"

# Splash nguyen sinh cua he dieu hanh (truoc khi Flutter engine ve khung hinh dau tien) — CHI mot
# mau nen xanh, KHONG kem icon. Icon Android 12 co luc khong ve ra (tuy thiet bi), tao cam giac
# "dung hinh" truoc khi SplashScreen tuy chinh (lib/features/auth/splash_screen.dart) hien coc +
# khoi; bo icon o day thi giai doan nay chi la mot manh xanh phang, chuyen tiep sang coc animated
# nhin lien mach thay vi giat/lap logo hai lan. Tao lai bang: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1A56A8"
  android_12:
    color: "#1A56A8"
  android: true
  ios: true
